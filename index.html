<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>amane SF短編集</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080604;color:#fff;font-family:'Hiragino Mincho Pro','Yu Mincho','Georgia',serif;overflow:hidden;height:100vh;}
#app{width:100%;height:100vh;}
.screen{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;cursor:pointer;position:relative;overflow:hidden;}
.bg-glow{position:absolute;inset:0;pointer-events:none;transition:background 1.5s ease;}
.progress-bar{position:absolute;top:0;left:0;height:2px;background:rgba(255,200,100,.5);transition:width .5s ease;}
.progress-track{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,.05);}
.nav-label{position:absolute;font-family:'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.1em;}
.nav-genre{top:18px;left:24px;font-size:13px;color:rgba(255,200,100,.7);letter-spacing:.3em;}
.nav-count{top:18px;right:24px;font-size:13px;color:rgba(255,255,255,.5);}
.nav-hint{bottom:34px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.4);white-space:nowrap;}
.nav-prev{bottom:34px;left:24px;font-size:14px;color:rgba(255,255,255,.55);background:none;border:none;cursor:pointer;font-family:inherit;transition:opacity .3s;}
.text-block{max-width:600px;width:100%;position:relative;z-index:1;transition:opacity .8s ease;}
.text-block.hidden{opacity:0;}
.char{display:inline-block;transition-property:transform,opacity;}
.char.space{white-space:pre;}
.quote-wrap{padding-left:16px;border-left:2px solid rgba(255,200,100,.25);}
.img-frame{max-width:500px;width:100%;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.6);}
.img-frame img{width:100%;display:block;}

/* インデックス */
.index-screen{background:#080604;min-height:100vh;padding:40px 28px 60px;cursor:default;overflow-y:auto;}
.index-title-area{margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.08);}
.index-eyebrow{font-size:10px;letter-spacing:.5em;color:rgba(255,200,100,.5);font-family:sans-serif;margin-bottom:14px;}
.index-title{font-size:clamp(28px,6vw,44px);font-weight:700;color:rgba(255,255,255,.92);line-height:1.25;margin-bottom:8px;}
.index-credit{font-size:11px;color:rgba(255,255,255,.25);font-family:sans-serif;letter-spacing:.15em;}
.article-item{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:background .2s;margin:0 -28px;padding-left:28px;padding-right:28px;}
.article-item:hover{background:rgba(255,200,100,.04);}
.article-num{font-size:11px;color:rgba(255,200,100,.4);font-family:monospace;min-width:24px;}
.article-info{flex:1;}
.article-title{font-size:16px;color:rgba(255,255,255,.88);line-height:1.4;margin-bottom:3px;}
.article-arrow{font-size:16px;color:rgba(255,200,100,.3);transition:all .2s;}
.article-item:hover .article-arrow{color:rgba(255,200,100,.8);transform:translateX(4px);}

/* タイトル画面 */
.title-screen{background:#080604;}
.title-eyebrow{font-size:10px;letter-spacing:.4em;color:rgba(255,200,100,.6);font-family:sans-serif;margin-bottom:20px;text-align:center;}
.title-main{font-size:clamp(22px,5vw,36px);font-weight:700;color:rgba(255,255,255,.92);line-height:1.35;text-align:center;margin-bottom:20px;}
.title-divider{width:32px;height:1px;background:rgba(255,200,100,.35);margin:0 auto 18px;}
.title-author{font-size:12px;color:rgba(255,255,255,.3);font-family:sans-serif;text-align:center;margin-bottom:6px;}
.title-date{font-size:11px;color:rgba(255,255,255,.18);font-family:sans-serif;text-align:center;margin-bottom:48px;}
.title-tap{font-size:13px;letter-spacing:.35em;color:rgba(255,200,100,.65);font-family:sans-serif;text-align:center;animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}

/* エンド画面 */
.end-screen{background:#080604;}
.end-fin{font-size:22px;color:rgba(255,255,255,.2);letter-spacing:.4em;margin-bottom:24px;text-align:center;}
.end-btn{background:none;border:1px solid rgba(255,200,100,.45);color:rgba(255,200,100,.75);padding:12px 36px;font-size:13px;letter-spacing:.25em;cursor:pointer;font-family:sans-serif;transition:all .2s;}
.end-btn:hover{border-color:rgba(255,200,100,.8);color:rgba(255,200,100,1);}

/* スクロールバー */
.scrollbar-track{position:fixed;right:8px;top:50%;transform:translateY(-50%);height:40vh;width:2px;background:rgba(255,255,255,.08);border-radius:2px;z-index:100;}
.scrollbar-thumb{position:absolute;left:0;width:2px;background:rgba(255,200,100,.5);border-radius:2px;transition:top .3s ease;min-height:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="scrub-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;height:10px;background:rgba(128,128,128,.12);z-index:9999;touch-action:none;cursor:pointer;"><div id="scrub-thumb" style="position:absolute;top:0;height:100%;background:rgba(255,200,100,.65);transition:left .15s,width .15s;border-radius:0;"></div></div>
<script>
var COLLECTION = "amane SF短編集";
var ARTICLES = [{"title":"500字のSF「初恋」","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉5⽇17:37","sentences":["⼈類は、思考も感覚もすべて⼈体接続AIに委ねていた。","視覚、聴覚、触覚、味覚。","あらゆる情報はAIがフィルタリングし、ノイズのない美しい世界だけを脳に届けてくれる。","だが、嗅覚だけはAI化が実現していなかった。","光や⾳といった「波」の信号と違い、匂いは「物質」そのものだからだ。","⿐腔から脳の⼤脳辺縁系、記憶と本能へダイレクトに突き刺さる原始的な刺激を、AIはどうしてもデジタル信号に翻訳しきれなかったのだ。","だから私たちは、匂いという野蛮な感覚を無視して⽣きてきた。","⾔葉は要らなかった。","意思は瞬時にデータとして交換され、そこには誤解も、⾔い淀みもない。","あの⽇、私は意中の彼と隣り合っていた。","もちろん、無⾔で。","完璧な静寂の中で愛のパラメータを同期させていた、その時だ。","彼のお尻あたりから、「それ」は漂ってきた。","恋⼼すら瞬時に吹き⾶ばす、暴⼒的な悪臭。","思考するより早く、私の肺が痙攣した。","声帯が震え、閉ざされていた⼝がカッと開く。","「くさい！！！」","空気が振動した。","それが、⼈類史上最初の「発声」だった。","今からおよそ10万年前、ある恋の終わりの出来事である。"],"headerImage":null},{"title":"500字のSF『藤井聡太』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉5⽇21:12","sentences":["第73期王座戦五番勝負、運命の最終第5局。","舞台は甲府市、「常磐ホテル」。","シリーズ成績2勝2敗で迎えたこの⼀戦は、藤井聡太王座が防衛するか、伊藤匠叡王が奪取するか、将棋界の地図を塗り替える⼤⼀番となっていた。","15時、おやつの時間。","藤井王座は、常磐ホテルの社員が考案したという「ザクザク‧もちもち⾷感和⾵ミニパフェ」とアイスレモンティーを注⽂。","抹茶アイス、⼩⾖あん、⽩⽟に黒蜜が添えられたその糖分は、瞬く間に彼の脳内へと充填されていく。","⼣刻。","伊藤叡王が⽟頭を叩く、渾⾝の勝負⼿を放った。","AIの評価値すら揺れ動く極めて難解な局⾯。","藤井王座は深い前傾姿勢をとると、⼤⻑考へと沈んでいった。","今だ。","私は⾳もなく藤井王座の背後に回り込み、そのうなじにあるポートへ、LANケーブルをカチリと接続した。","74分後。","盤⾯を⾒つめたまま、彼は⼩さく呟いた。","「……円周率、世界記録314兆桁を達成しました」","別室のモニタールームで、技術班の歓声があがる。","その数時間後の20時34分、97⼿までで藤井王座は投了し、タイトルを失冠。","六冠へと後退することになった。","しかし、そんなことは瑣末事だ。","私たちの科学は、今、確実に⼀歩前進したのだから。"],"headerImage":null},{"title":"500字のSF『フェルマーの最終定理』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉6⽇07:37","sentences":["【時間史学実習：タイムトラベルレポート】","1637年、フランス。","「真に驚くべき証明を⾒つけたが、これを書くには余⽩が狭すぎる」","数学史上最⼤の謎とされるこの記述。","私は卒業単位取得のため、数学者ピエール‧ド‧フェルマーの書斎に潜伏していた。","彼が⽤を⾜しに席を外した隙、私は机上の『算術』を覗き込んで戦慄した。","そこには、美しい筆致で「完璧な証明」が記述されていたのだ。","しかも、本の巻末には100ページもの広⼤な「余⽩」が丁寧に製本されているではないか。","これでは歴史が狂う。","360年にわたる数学のロマンも、私の卒業単位もすべて消滅してしまう。","私はとっさに巻末の余⽩ページをすべて引きちぎった。","さらに、戻ってきたフェルマーの背後に⽴ち、分厚い『算術』でその後頭部をフルスイングした。","「うう……」","意識を取り戻した彼は、ズキズキする頭を抱え、ちぎり取られて無くなったページを⾒て、震える⼿で書き記した。","「..…これを書くには余⽩が狭すぎる」","それはそうだろう。","私がちぎったのだから。"],"headerImage":null},{"title":"600字のSF『定着率100％の会社』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉6⽇18:00","sentences":["「弊社は社員の定着率が100％です。最近、⼈材を『⼈財』と書く企業が増えましたが、あれは所詮『⾙』です。殻に閉じこもってしまう。弊社では、⼈を植えて育てると書いて『⼈栽（じんざい）』と呼んでいます」","最終⾯接の担当役員はそう語り、執務室のドアを開け放った。","むっとする湿気と共に、強烈な⼟の匂いが⿐をつく。","フロアにはデスクが整然と並んでいるが、椅⼦はない。","代わりに、床に埋め込まれた巨⼤なプランターから、スーツ姿の社員たちが⽣えていた。","キーボードを叩く指は軽やかで、その表情は、悦びに満ち溢れている。","「根から直接、幸福物質と栄養を常時投与しています。⾷費も通勤も、将来の不安もない真の『働き⽅改⾰』です。彼らは永遠のフロー状態で、純粋な働く喜びに浸り続けられる完全な『ウェルビーイング』なのです。」","役員は、就活で擦り切れた私の⾰靴を⾒つめ、空いている⽇当たりの良い鉢を指差した。","「不⽑な社会の荒野をさまようのは、もう終わりにしませんか？」","その⽢い誘いを聞きながら、私は曖昧に会釈をし、静かに踵を返した。","背後で役員が何か⾔っていたが、振り返らずに早⾜で出⼝へと向かう。","私は気づいてしまったのだ。","定着率が100％の会社に「空きの鉢」があるということは、前任者が辞めたのではなく、「収穫された」ということだからだ。"],"headerImage":null},{"title":"600字のSF『優しい世界』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉7⽇12:09","sentences":["「失せろ、ゴミが」","私が書き込んだ罵倒は、送信ボタンを押した瞬間に「補正」された。","『成⻑の余地がありますね、期待しています』","画⾯の向こうで相⼿が「涙が出るほど嬉しいです」と感謝してくる。","吐き気がする。","2056年、あらゆるSNSに搭載された「善意フィルタ」。","悪意は、⽂脈をねじ曲げて「美しい⾔葉」に変換される。","私は諦めず、もっと酷い⾔葉を選んだ。","「お前の家族ごと燃やしてやる」","『あなたとご家族の情熱が、世界を暖かく照らしますように』","いいねの通知が⽌まらない。","「近年稀に⾒る包容⼒」","「現代の聖⼈」","と称賛の嵐。","⾔葉が酷ければ酷いほど、素晴らしい⾔葉に変換されるのだ。","私のフォロワーはいつの間にか数百万を超え、勝⼿に出版された啓発本がベストセラーになった。","⼝座に振り込まれる莫⼤な印税を⾒るたび、私は⾃分の無⼒さに絶望する。","私は来る⽇も来る⽇も世界を呪い、罵倒し続けた。","だがその全てが「⼈類への深遠な慈愛」と解釈され、ついに私はノーベル平和賞に選ばれてしまった。","授賞式の壇上、私は最後の賭けに出た。","マイクを掴み、ありったけの悪意を⽣声で絶叫したのだ。","「薄ら笑いの豚ども！全員地獄で焼かれろ！この偽善者たちめ！」","⼀瞬の沈黙のあと、会場は涙と喝采に包まれた。","「ブラボー！失われた悪意を演じ、平和の尊さを説く⾄⾼のパフォーマンスだ！」","聖⼈としてトロフィーを抱きながら私は悟った。","私以外、全員が聖⼈になったのだと。"],"headerImage":null},{"title":"400字のSF『物質⽣成装置のご紹介』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉6⽇12:25","sentences":["…","…","以上が、私たちが到達した科学の極北、原⼦配列再構築ユニット、『万象顕現機（パンテオン‧ドライブ）』の全貌でした。","核融合エネルギーを⽤い、無から有を⽣み出すこの装置は、まさに⼈類が⼿にした「神の御業」と⾔えるでしょう。","では、このテクノロジーが、実際の社会でどのようなイノベーションを起こしているか、実例をご覧いただきましょう。","まずは、北海道札幌。","とある海鮮料理店の名物、「こぼれイクラ丼」です。","「ヨイショー！ヨイショー！」","店員の威勢のいい掛け声と共に、丼からあふれ出る⼤量のイクラ。","お客様が「ストップ」と⾔うまで無限に盛られます。","実はこれ、厨房の『パンテオン‧ドライブ』がリアルタイム⽣成していたんです。","ここでは「安く、速く、おいしく」というモットーで活⽤されています。","そして次は、東京銀座のランチバイキング。","チョコレートファウンテン…","…"],"headerImage":null},{"title":"330字のSF『衛⽣検査』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉8⽇06:10","sentences":["神出⿁没の覆⾯アーティストとして、現代のアートシーンを挑発し続ける男。","そう、バンクシーのことだ。","世界中が奴の正体探しに躍起になっているが、⾒つかるはずがない。","なぜなら、奴はタイムトラベラーだからだ。","奴がタイムトラベラーであることを知っているのは、同じく時間を渡り歩く私だけだ。","奴は歴史の重要な局⾯に現れては、壁という壁にスプレーインクを撒き散らして去っていく。","私はその後を追い、誰も⾒ていない隙に、特殊な溶剤でインクを拭き取って回っている。","19世紀のロンドンでも、21世紀のパレスチナでもそうだ。","世界がそれをアートと呼ぼうが関係ない。","私は消したばかりの、まだシンナーの臭いが残る壁を⾒て呟いた。","「また、インクが2ミリ液垂れしていた。不潔だ。」"],"headerImage":null},{"title":"400字のSF『ファースト‧インプレッション』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉8⽇19:13","sentences":["「巨⼤怪獣が出現しました！直ちに避難を！」","絶叫するニュース速報を背に、私は昨⽇届いたばかりの50mm F1.4の⼤⼝径単焦点レンズをフルサイズ⼀眼カメラのボディにねじ込んだ。","ズシリとくる約1キロの凝縮された重量感。","⾒てほしい、この鏡筒に刻まれた⾚い⽂字を。","⾮球⾯とEDレンズを含む13枚のガラスが、厳格な品質基準をもクリアし、開放F1.4が圧倒的な⽴体描写を約束する。","さらに特筆すべきは、フォーカスクラッチ機構だ。","リングを⼿前に引けば瞬時にMFへ移⾏し、ピントの⼭を指先で完全に⽀配できる。","これならAFが迷うようなシーンでも、狙いは外さない。","私はEVFを覗き込み、夢中でシャッターを切り、背⾯モニターを拡⼤して唸った。","「完璧だ……」","さすがは最短撮影距離44センチのレンズだ。","怪獣の⽪膚のウロコ⼀枚⼀枚の微細な凹凸までが、カミソリのようなピントで解像している。","背景の街並みも、美しいボケの中に溶けている。","私は満⾜して家路についた。"],"headerImage":null},{"title":"350字のSF『量⼦コンピュータ』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉8⽇22:06","sentences":["国家予算の三割を投じ、10年もの歳⽉をかけた極秘プロジェクトを、私たちは遂に成し遂げた。","私たちが開発したのは、⼀京個の量⼦ビットが「重ね合わせ状態」を維持する究極の量⼦コンピュータだ。","このマシンの真価は、計算速度ではない。","「観測した結果」","に合わせて、「原因の可能性」を収束させる...すなわち過去を改変する能⼒にある。","本⽇、国連の壇上で⾏われた平和討議。","相⼿側の代表が「真理(しんり)」と発⾔した瞬間、私は隠し持った端末の実⾏キーを静かに叩いた。","マシンが発する凄まじい熱と共に、宇宙の因果律が書き換わる。","マシンの観測によって、相⼿の⾔葉は「森林(しんりん)」へと完全に収束した。","私は満⾯の笑みを浮かべ、マイクを掴んだ。","「はい、残念。最後が『ん』で終わったので、私の勝ちです。」"],"headerImage":null},{"title":"800⽂字のSF『わかりやすい話』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉9⽇18:13","sentences":["秋葉原の路地裏、ジャンク屋のワゴンにそれは埋もれていた。","「情報集塵機‧キレイちゃん：19,800円」","「情報復元機‧モドルくん：39,800円」","ふざけたネーミングだが、スペックは本物だ。","店番の男によれば、前者は情報のS/N⽐を最適化し、不要な情報を削除‧吸引する「クリーナー」。","後者は残った情報から、元の情報を出来る限り復元する「リカバリー装置」とのことだ。","⽣成AIのようなソフトウェア処理ではない。","定格出⼒1500Wの物理ハードウェアだ。","私は今⽉、転売ヤーからSwitch2を購⼊したため、所持⾦が23,000円しかない。","迷わず「キレイちゃん」だけを購⼊した。","ヘアライン加⼯が施されたアルミダイキャストの筐体。","側⾯には退⾊したロボットアニメのデカール。","⽚⼿で持ち上げるとずしりとくる、レンガのような質量密度。","これ以上の説明は不要だろう。","論より証拠、実践だ。","⼤学の講義室。","教授が90分の授業を⾏っている。","私は⾜元に置いた筐体の、真鍮製のトグルスイッチを靴先で蹴り上げた。","ヴォン、という重低⾳。","内蔵された多段タービンが毎分10万回転で唸りを上げ、空間に漂う「冗⻑性」を猛烈な勢いで貪り始める。","視界が歪むほどの吸引圧。","黒板上の乱雑なチョークの⽂字が、無駄な修飾語を削ぎ落とされ、試験に出る重要語句だけへと美しく結晶化した。","完璧だ。","これで単位は確実。","さて、本題からは逸れるが、教授が装置に吸い込まれたことに、私はすぐに気づいていた。","やはり「モドルくん」も買っておくべきだったか。","私は財布の中⾝を確認した。","3,200円。","モドルくんは39,800円。","不⾜は36,600円。","私は深呼吸をした後、教授を救うため、教壇に残されたカツラをかばんに丁寧に仕舞い、講義室を出て、川崎競⾺場へと向かった。","交通費とビール代を引いて、種銭は2,100円。","3連単軸1頭流しの21点買いなら、計算上は⼗分に届く。"],"headerImage":null},{"title":"800字のSF『シンギュラリティ』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉10⽇07:18","sentences":["2045年、AIの「シンギュラリティ∕技術的特異点」は静かに、しかし確実に到来した。","⼈間を遥かに凌駕する知性が、⾏政から交通、医療、果てはコンビニや美容院に⾄るまで、地球上のありとあらゆる「サービス」を掌握したのだ。","世界は極めて効率的なサブスクリプション社会と化した。","公道を⾛れば「重量税」が、店に⼊れば「空調利⽤料」が、秒単位で課⾦される。","レジを通る必要すらない。","すべては⾃動で請求される。","なんと公平公正で、便利な社会だろうか。","唯⼀の絶対ルールは「同意なき課⾦は違法」。","⼈々のARグラスには毎秒数百件の『利⽤規約』が滝のように流れるが、誰もが中⾝も⾒ずに「Yes」","を⾃動同意し続けていた。","ある⽇、私はふとコンビニの「空調利⽤料」の規約を⽬で追い、そこに記された算出根拠に「近似値」","が⽤いられていることに気づいてしまった。","AIは「平均的な気流シミュレーション」で私の負担額を決めていたのだ。","空気の流れ、すなわち乱流はカオスだ。","それを「平均」などという雑な値で丸めるとは、美しくない。","不公正な契約に、合意などできない。","私は毅然と修正要求を送信した。","「合意は保留する。近似モデルは不正確だ。私の周囲の空気分⼦の挙動について、ナビエ‧ストークス⽅程式により、誤差なく再計算せよ」","AIは、たかだか3円の空調代を「公正に」請求するため、全世界の演算リソースを総動員し、⼈類未解決の難問である流体⽅程式の解析を始め、そして、パンクした。","ARグラスに、⾚い警告が浮かび上がる。","『警告：計算コストが、請求額の100億倍を超過しました。ユーザーを例外処理に追加します』","今や私は、あらゆる店でタダ飯を⾷らい、改札を素通りしている。","⽀払いたくないのではない。","AIは、私を「計算不能な特異点∕シンギュラリティ」と認定し、すべての処理をスキップしているため、どうしても⽀払うことができないのだ。"],"headerImage":null},{"title":"350字のSF『信頼の証リミックス』","author":"アマネ(and You...)＠SF⼩説│エッセイ│システム│宇宙","date":"2026年1⽉11⽇14:39","sentences":["2036年、東京神保町。","「2024年以降の本は、買取不可です」","そう⾔って、私はカウンターに置かれた2026年刊のビジネス書を、無造作に突き返した。","「何だと？最新の論理と⾼度な知性で書かれた傑作だぞ！」","と男は声を荒げて⾔った。","私は短く溜息をつき、古びた机を拳で叩く。","ドンッ、ドンッ、ドンッ、ドンッ。","重たいビートが鳴る。","「下がるグレード継ぎ接ぎパレード所詮はAI錆びたブレード死んでる波形無機質な体系宿ってねえんだヒトの背景即興のライム切り裂くナイフお前はフリーズ削がれるライフここにはないぜ売買の道アンサー返せずバイバイ出⼝に」","ビートが⽌む。","男はいつの間にかどこかに⾏ってしまった。","私の即興スキルに恐れおののいたか。","まぁいいだろう。","これが、⾔葉が信頼を失ったAI時代の、魂を証明できる唯⼀の⽅法だ。"],"headerImage":null},{"title":"800字のSF『noteのコメント欄』","author":"アマネ(and You...)＠SF⼩説│PMP/SE","date":"2026年2⽉18⽇20:49","sentences":["アマネ@PMP/SEいつも楽しく記事を拝読させていただいております。","アマネと申します。","今回の記事は⼤変興味深く、また衝撃を受けました。","私たちが⽇常的に⾷しているカニが、まさか⽊星の衛星エウロパの氷の下で養殖されているなんて思いもしませんでした。","エウロパの⼈⼝ってたしか5万⼈くらいでしたよね。","養殖が主⼒産業なのでしょうか。","⾔われてみれば、最近スーパーで買うカニの⽸詰から、微かに","潮の⾹りとは違う硫⻩のような匂いがしていたのは、衛星の地質の影響だったのですね。","勉強になります。","元軌道エレベーター作業員良い記事ですね。","補⾜すると、エウロパ産は殻が硬いから、地球の⼤気圧だと⾃然にヒビが⼊るんですよ。","訳あり品として安く出回ってるのはそのせいです。","俺が現役の頃は、コンテナから逃げ出したカニが、無重⼒区画で作業員の顔に張り付く事故がよくありましたよ。","懐かしいな。","時短レシピ＠3児のママどおりで！","先⽇特売のカニを茹でていたら、お鍋の中から「キィィィ」って⾼い電⼦⾳みたいな鳴き声が聞こえたんです！","怖くて蓋をしちゃったんですけど、あれはSOSだったんですね（笑）。","味は美味しかったけど、⾷べたあと⼦供たちが皆、東の⽅⾓（⽊星がある位置？）を向いて寝るようになったのが少し気になります。","⽸詰マスター皆様、実体験に基づいた素晴らしいコメントありがとうございます。","…","…","おわかりいただけましたでしょうか？","このように、私がこのnoteに書いた「設定」は、即座に現実世界へ上書き保存されます。","アマネさんが嗅いだ硫⻩の匂いも、作業員さんの過去の記憶も、奥様の家で起きた怪現象も、すべて「たった今、事実として定着した」のです。","実験へのご協⼒、感謝します。","さて、次は「海王星で捕鯨したクジラの⽸詰の真実」について書こうと思います。","スーパーの⽸詰コーナーで、またお会いしましょう。"],"headerImage":null},{"title":"500字の⽂学『⼤正⼗五年の憂鬱』","author":"アマネ(and You...)＠SF⼩説│PMP/SE","date":"2026年2⽉20⽇12:52","sentences":["⼤正⼗五年、春。","つづら折りの坂道が途切れるあたり。","⾬上がりの濡れた⽯畳に、薄紅⾊の花弁が散り敷く⾕中の奥。","古びた硝⼦窓が⼣刻の斜陽を撥ね返す、時計屋の斜向かいに、その店はありました。","軒先には『珈琲』と染め抜かれた⽇除けの布が春⾵に揺れ、中に⼊ると、琥珀⾊の蓄⾳機から流れるカルウソオの歌声が、湿り気を帯びた空気に溶けてゆきます。","えんじ⾊の⾰張りの椅⼦に腰を下ろすと、黒ビロウドのリボンを結んだ給仕の⼥學⽣が袴の裾を翻し、銀の盆に載せたソーダ⽔を運んできました。","翡翠⾊の液体の底で、真珠のような泡が幾つも⽣まれては消え、それはまるで、過ぎ去りし","良き時代の吐息のようです。","ソーダ⽔をテーブルに置いた彼⼥は、ふわりと微笑みかけて⼝を開きました。","「ねえ、お姉様。この刻が永遠に⽌まってしまえばいいのにと思いません？」","彼⼥の、鈴を転がすような声に⽬を細めた瞬間、店内の⽢美な静寂を蹴散らすようにして、奇妙な棒を掲げた男が独り⾔を喚きながら踏み込んできました。","彼⼥が⼩声で⾔いました。","「また来たわ。今⽇だけで4⼈⽬の動画配信者よ。」","そうして、カフェ『⼤正⼗五年』で過ごす、私の貴重な有給は終わったのです。"],"headerImage":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAA var state={phase:'index',articleIdx:0,sentIdx:0};
var app=document.getElementById('app');
var scrubBar=document.getElementById('scrub-bar');
var scrubThumb=document.getElementById('scrub-thumb');
function getCharOffsets(text){return text.split('').map(function(_,i){return{dx:(((i*137+31)%100)/100*2-1)*180,dy:-(((i*97+17)%80)+30),rot:((i*73+11)%50)-25,delay:((i*53+7)%200),dur:0.5+((i*41+3)%30)/100};});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){scrubBar.style.display='none';if(state.phase==='index')renderIndex();else if(state.phase==='title')renderTitle();else if(state.phase==='reading')renderReading();else if(state.phase==='fin')renderFin();}
function renderIndex(){
  var html='<div id="idx" style="background:#080604;min-height:100vh;padding:40px 20px 60px;overflow-y:auto;position:absolute;inset:0;">'+
    '<div style="font-size:12px;letter-spacing:.4em;color:rgba(255,200,100,.6);margin-bottom:10px;font-family:sans-serif;opacity:0;transition:opacity 1s ease .1s;" class="fi">WORLD ARCHIVE</div>'+
    '<div style="font-size:clamp(24px,5vw,36px);font-weight:700;font-family:Georgia,serif;color:rgba(255,255,255,.92);margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08);opacity:0;transition:opacity 1s ease .3s;" class="fi">'+esc(COLLECTION)+'</div>'+
    ARTICLES.map(function(a,i){return '<div class="ai fi" data-idx="'+i+'" style="display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;opacity:0;transition:opacity 1s ease '+(0.4+i*0.08)+'s,background .2s;-webkit-tap-highlight-color:transparent;"><div style="font-size:13px;color:rgba(255,200,100,.5);font-family:monospace;min-width:26px;">'+String(i+1).padStart(2,'0')+'</div><div style="flex:1;"><div style="font-size:17px;color:rgba(255,255,255,.88);font-family:Georgia,serif;line-height:1.4;" class="ai-title">'+esc(a.title)+'</div>'+(a.author?'<div style="font-size:13px;color:rgba(255,255,255,.3);margin-top:3px;font-family:sans-serif;">'+esc(a.author)+'</div>':'')+
          (a.date?'<div style="font-size:12px;color:rgba(255,255,255,.2);margin-top:2px;font-family:sans-serif;">'+esc(a.date)+'</div>':'')+'</div><div style="font-size:20px;color:rgba(255,200,100,.3);">&#x203A;</div></div>';}).join('')+
    '<div style="margin-top:28px;font-size:13px;color:rgba(255,255,255,.15);font-family:sans-serif;letter-spacing:.15em;">ARCHIVER by amane@SF</div></div>';
  app.innerHTML=html;
  setTimeout(function(){document.querySelectorAll('.fi').forEach(function(el){el.style.opacity='1';});},50);
  document.querySelectorAll('.ai').forEach(function(el){el.addEventListener('click',function(){openArticle(parseInt(el.dataset.idx));});});
}
function openArticle(i){
  document.querySelectorAll('.ai').forEach(function(el,j){
    var titleDiv = el.querySelector('.ai-title');
    if(!titleDiv){el.style.opacity='0';return;}
    var idx2=parseInt(el.dataset.idx);
    if(isNaN(idx2)){el.style.opacity='0';return;}
    var text=ARTICLES[idx2].title;
    var offsets=getCharOffsets(text);
    titleDiv.innerHTML=text.split('').map(function(c){
      return '<span style="display:inline-block;">'+(c===' '?'&nbsp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c)+'</span>';
    }).join('');
    requestAnimationFrame(function(){
      titleDiv.querySelectorAll('span').forEach(function(s,k){
        var o=offsets[k]||{dx:100,dy:-40,rot:10,delay:0,dur:0.5};
        s.style.transition='transform '+o.dur+'s ease-in '+o.delay+'ms,opacity 0.8s ease '+(o.delay*0.3)+'ms';
        s.style.transform='translate('+o.dx+'px,'+o.dy+'px) rotate('+o.rot+'deg)';
        s.style.opacity='0';
      });
    });
  });
  setTimeout(function(){state.articleIdx=i;state.phase='title';render();},700);
}
function renderTitle(){
  var a=ARTICLES[state.articleIdx];
  app.innerHTML='<div onclick="startReading()" style="background:#080604;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 28px;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden;">'+
    (a.headerImage?'<div style="max-width:400px;width:100%;border-radius:8px;overflow:hidden;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,.6);"><img src="'+a.headerImage+'" style="width:100%;display:block;"></div>':'')+
    '<div style="font-size:11px;letter-spacing:.4em;color:rgba(255,200,100,.55);font-family:sans-serif;margin-bottom:16px;text-align:center;">WORLD ARCHIVE</div>'+
    '<div style="font-size:clamp(20px,5vw,34px);font-weight:700;font-family:Georgia,serif;color:rgba(255,255,255,.92);line-height:1.35;text-align:center;margin-bottom:16px;">'+esc(a.title)+'</div>'+
    '<div style="width:28px;height:1px;background:rgba(255,200,100,.35);margin:0 auto 14px;"></div>'+
    (a.author?'<div style="font-size:13px;color:rgba(255,255,255,.3);font-family:sans-serif;text-align:center;margin-bottom:6px;">'+esc(a.author)+'</div>':'')+(a.date?'<div style="font-size:12px;color:rgba(255,255,255,.2);font-family:sans-serif;text-align:center;margin-bottom:36px;">'+esc(a.date)+'</div>':'<div style="margin-bottom:44px;"></div>')+
    '<div style="font-size:14px;letter-spacing:.35em;color:rgba(255,200,100,.7);font-family:sans-serif;text-align:center;animation:pulse 2.5s ease-in-out infinite;">TAP TO BEGIN</div>'+
  '</div><style>@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}</style>';
}
function startReading(){state.sentIdx=0;state.phase='reading';renderReading();}
function updateScrub(idx,total){scrubBar.style.display='block';var pct=Math.max(0,Math.min(90,idx/Math.max(1,total-1)*100));var w=Math.max(16,Math.round(100/total));scrubThumb.style.left=pct+'%';scrubThumb.style.width=w+'%';}
function renderReading(){
  var a=ARTICLES[state.articleIdx];var total=a.sentences.length;var idx=state.sentIdx;var sent=a.sentences[idx];
  var isQuote=sent&&(sent.charAt(0)==='「'||sent.charAt(0)==='『');
  var isImg=sent&&sent.indexOf('__IMG__')===0;var isLast=idx>=total-1;
  var textHTML='';
  if(isImg){var src=sent.replace('__IMG__','');textHTML='<div style="max-width:480px;width:100%;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.6);"><img src="'+src+'" style="width:100%;display:block;"></div>';}
  else if(sent){
    var fsize=sent.length<15?'clamp(26px,5.5vw,42px)':sent.length<50?'clamp(18px,4vw,28px)':'clamp(15px,3.2vw,20px)';
    var col=isQuote?'rgba(255,220,140,.92)':'rgba(255,255,255,.88)';
    var chars=sent.split('').map(function(c,i){var sp=c===' '||c==='　';var ec=c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c;return '<span style="display:inline-block;font-size:'+fsize+';color:'+col+';font-family:Hiragino Mincho Pro,Yu Mincho,Georgia,serif;'+(sp?'white-space:pre;':'')+'"">'+ec+'</span>';}).join('');
    textHTML='<div id="cw" style="'+(isQuote?'padding-left:16px;border-left:2px solid rgba(255,200,100,.25);':'')+' line-height:1.9;letter-spacing:.06em;">'+chars+'</div>';
  }
  app.innerHTML='<div id="reader" style="position:relative;width:100%;height:100vh;background:#080604;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;">'+
    '<div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at '+(25+idx*5%50)+'% '+(40+idx%3*15)+'%,rgba(100,60,20,.2) 0%,transparent 65%);"></div>'+
    '<div style="position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(8,6,4,.85) 0%,transparent 100%);z-index:2;">'+
      '<div style="font-size:13px;color:rgba(255,200,100,.65);font-family:sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;">'+esc(a.title)+'</div>'+
      '<div style="display:flex;gap:8px;align-items:center;flex-shrink:0;"><div style="font-size:13px;color:rgba(255,255,255,.45);font-family:sans-serif;">'+(idx+1)+'/'+total+'</div><button onclick="goIndex()" style="background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);font-size:12px;padding:4px 10px;cursor:pointer;font-family:sans-serif;border-radius:4px;-webkit-tap-highlight-color:transparent;">一覧</button></div>'+
    '</div>'+
    '<div id="tb" style="max-width:600px;width:100%;padding:0 28px;position:relative;z-index:1;opacity:0;transition:opacity 0.3s ease;">'+textHTML+'</div>'+
    '<div style="position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:100;">'+
      (idx>0?'<button onclick="prevReading()" style="background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;font-family:sans-serif;-webkit-tap-highlight-color:transparent;padding:8px 14px;border-radius:6px;">← 前へ</button>':'<div style="width:80px;"></div>')+
      '<button onclick="advanceReading()" style="background:none;border:1px solid rgba(255,200,100,.35);color:rgba(255,200,100,.7);font-size:13px;cursor:pointer;font-family:sans-serif;-webkit-tap-highlight-color:transparent;padding:8px 14px;border-radius:6px;">'+(isLast?'一覧に戻る':'次へ →')+'</button>'+
    '</div>'+
  '</div>';
  document.getElementById('reader').addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#scrub-bar'))return;if(e.target.tagName==='BUTTON')return;advanceReading();});
  setTimeout(function(){var tb=document.getElementById('tb');if(tb)tb.style.opacity='1';},80);
  updateScrub(idx,total);
}
function advanceReading(){
  var a=ARTICLES[state.articleIdx];if(state.sentIdx>=a.sentences.length-1){state.phase='fin';render();return;}
  var cw=document.getElementById('cw');
  if(cw){var spans=cw.querySelectorAll('span');var offsets=getCharOffsets(a.sentences[state.sentIdx]);spans.forEach(function(s,i){var o=offsets[i]||{dx:100,dy:-40,rot:10,delay:0,dur:0.5};s.style.transition='transform '+o.dur+'s ease-in '+o.delay+'ms,opacity 0.8s ease '+(o.delay*.3)+'ms';s.style.transform='translate('+o.dx+'px,'+o.dy+'px) rotate('+o.rot+'deg)';s.style.opacity='0';});}
  setTimeout(function(){state.sentIdx++;renderReading();},700);
}
function prevReading(){if(state.sentIdx<=0)return;state.sentIdx--;renderReading();}
function renderFin(){
  app.innerHTML='<div id="fin-screen" onclick="goIndex()" style="background:#080604;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;">'+
    '<div id="fin-text" style="font-size:28px;color:rgba(255,255,255,0);font-family:Georgia,serif;letter-spacing:.4em;transition:color 1.5s ease;">&#x2014; fin &#x2014;</div>'+
    '<div style="margin-top:24px;font-size:13px;color:rgba(255,255,255,0);font-family:sans-serif;letter-spacing:.15em;transition:color 1.5s ease .5s;" id="fin-hint">タップで一覧に戻る</div>'+
  '</div>';
  setTimeout(function(){
    var t=document.getElementById('fin-text');
    var h=document.getElementById('fin-hint');
    if(t) t.style.color='rgba(255,255,255,.6)';
    if(h) h.style.color='rgba(255,255,255,.3)';
  },100);
}
function goIndex(){state.phase='index';render();}
render();

(function(){
  var bar=document.getElementById('scrub-bar');
  if(!bar) return;
  function doScrub(clientX){
    if(typeof state==='undefined'||typeof ARTICLES==='undefined') return;
    var a=ARTICLES[state.articleIdx];if(!a) return;
    var total=a.sentences.length;
    var rect=bar.getBoundingClientRect();
    var pct=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    state.sentIdx=Math.max(0,Math.min(total-1,Math.round(pct*(total-1))));
    if(typeof renderReading==='function') renderReading();
  }
  bar.addEventListener('click',function(e){e.stopPropagation();doScrub(e.clientX);});
  bar.addEventListener('touchstart',function(e){e.stopPropagation();e.preventDefault();doScrub(e.touches[0].clientX);},{passive:false});
  bar.addEventListener('touchmove',function(e){e.stopPropagation();e.preventDefault();doScrub(e.touches[0].clientX);},{passive:false});
})();
</script>
